[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scan"
version = "0.3.0"
description = "A local-first Python security CLI with Bandit and OpenAI-compatible LLM review"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "bandit>=1.7.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "openai>=1.30,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
scan = "scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
