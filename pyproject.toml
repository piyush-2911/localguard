[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scan"
version = "0.1.0"
description = "A security scanner CLI for Python code (Stage 1: static analysis via Bandit)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "bandit>=1.7.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
scan = "scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
